<script>
const { createApp } = Vue;

createApp({
    data() {
        return {
            users: []
        }
    },
    methods: {
        getFirstChar(username) {
            if (!username || username.length === 0) return '?';
            return username.charAt(0);
        }
    },
    mounted() {
        fetch('./sdf-public/sdf-data/sdf-users.php?type=getAllUsers')
            .then(response => response.json())
            .then(json => {
                if (json.code === 0) {
                    this.users = json.data || [];
                }
            })
            .catch(() => {
                this.users = [];
            });
    }
}).mount('#page-users');
</script>
