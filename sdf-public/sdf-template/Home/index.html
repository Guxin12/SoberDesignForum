<script src="./sdf-public/sdf-assets/js/typed.umd.js"></script>
<script>
const { createApp } = Vue;

const appData = {
  data() {
    return {
      topics: [],
      followersMap: {},
      offset: 0,
      currentIndex: 0,
      slideCount: 0,
      autoTimer: null,
      viewport: null,
      track: null,
      dialogVisible: false,
      currentTopic: null,
      isMobile: window.innerWidth <= 600 // 新增：移动端检测
    };
  },

  computed: {
    currentFollowers() {
      if (!this.currentTopic) return [];
      return this.followersMap[this.currentTopic.topic_id] || [];
    }
  },

  methods: {
    // 处理窗口大小变化
    handleResize() {
      this.isMobile = window.innerWidth <= 600;
    },

    fetchTopics() {
      return fetch('./sdf-public/sdf-data/sdf-index.php?type=getAllTopics')
        .then(r => r.json())
        .then(result => {
          this.topics = result.data || [];
        })
        .catch(error => {});
    },

    fetchFollowers() {
      return fetch('./sdf-public/sdf-data/sdf-index.php?type=getAllTopicsfollow')
        .then(r => r.json())
        .then(result => {
          if (result.code === 0 && Array.isArray(result.data)) {
            const map = {};
            result.data.forEach(item => {
              map[item.topic_id] = item.followers || [];
            });
            this.followersMap = map;
          }
        })
        .catch(error => {});
    },

    getFollowerCount(topic) {
      return this.followersMap[topic.topic_id]?.length || 0;
    },

    showFollowers(topic) {
      this.currentTopic = topic;
      this.dialogVisible = false;
      this.$nextTick(() => {
        this.dialogVisible = true;
      });
    },

    closeDialog() {
      this.dialogVisible = false;
    },

    // 轮播相关方法（保持不变）
    updatePosition() {
      if (!this.viewport) return;
      this.offset = -this.currentIndex * 100;
    },

    goTo(newIndex) {
      if (this.slideCount <= 1) return;
      this.currentIndex = (newIndex % this.slideCount + this.slideCount) % this.slideCount;
      this.updatePosition();
    },

    stopAuto() {
      if (this.autoTimer) {
        clearInterval(this.autoTimer);
        this.autoTimer = null;
      }
    },

    startAuto() {
      this.stopAuto();
      if (this.slideCount <= 1) return;
      this.autoTimer = setInterval(() => {
        this.goTo(this.currentIndex + 1);
      }, 3000);
    },

    initCarousel() {
      this.viewport = this.$refs.viewport;
      this.track = this.$refs.track;

      if (!this.viewport || !this.track) return;

      this.slideCount = this.track.children.length;
      if (this.slideCount === 0) return;

      this.currentIndex = 0;
      this.updatePosition();

      const section = this.viewport.closest('.topics-section');
      if (section) {
        section.addEventListener('mouseenter', this.stopAuto.bind(this));
        section.addEventListener('mouseleave', this.startAuto.bind(this));
      }

      this.startAuto();
    },

    destroyCarousel() {
      this.stopAuto();
      const section = this.viewport?.closest('.topics-section');
      if (section) {
        section.removeEventListener('mouseenter', this.stopAuto.bind(this));
        section.removeEventListener('mouseleave', this.startAuto.bind(this));
      }
    }
  },

  mounted() {
    window.addEventListener('resize', this.handleResize); // 监听窗口变化
    this.fetchTopics().then(() => {
      this.$nextTick(() => {
        this.destroyCarousel();
        this.initCarousel();
      });
      this.fetchFollowers();
    });
  },

  unmounted() {
    window.removeEventListener('resize', this.handleResize); // 移除监听
    this.destroyCarousel();
  }
};

createApp(appData).mount('#topiclb');

var Typewriter = new Typed('#Typewriter', {
  strings: ['Vue为核心', 'SoberDesign', '更优雅', '跨平台', '动态响应性', '无限距离'],
  typeSpeed: 100,
  backSpeed: 30,
  smartBackspace: true,
  loop: true
});

</script>
