<script src="./sdf-public/sdf-assets/js/typed.umd.js"></script>
<script>
const { createApp, ref, onMounted, onUnmounted, nextTick } = Vue;

const topiclb = createApp({
    setup() {
        const topics = ref([]);
        const viewport = ref(null);
        const track = ref(null);
        const offset = ref(0);

        // 轮播状态
        let currentIndex = 0;
        let slideCount = 0;
        let startX = 0;
        let dragOffset = 0;
        let isDragging = false;
        let autoTimer = null;
        const threshold = 0.3;

        // 更新轨道位置（响应式 offset）
        const updatePosition = (dragOffsetPx = 0) => {
            if (!viewport.value) return;
            const basePercent = -currentIndex * 100;
            if (dragOffsetPx && viewport.value.clientWidth) {
                const percent = (dragOffsetPx / viewport.value.clientWidth) * 100;
                offset.value = basePercent + percent;
            } else {
                offset.value = basePercent;
            }
        };

        // 切换到指定索引（带动画）
        const goTo = (newIndex) => {
            if (newIndex < 0 || newIndex >= slideCount) return;
            currentIndex = newIndex;
            track.value?.classList.remove('dragging');
            updatePosition();
        };

        // 自动轮播控制
        const stopAuto = () => {
            if (autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
            }
        };
        const startAuto = () => {
            stopAuto();
            if (slideCount <= 1) return;
            autoTimer = setInterval(() => {
                // 只在没有拖拽且鼠标不在轮播区域时切换
                if (!isDragging && !viewport.value?.closest('.topics-section')?.matches(':hover')) {
                    const next = currentIndex === slideCount - 1 ? 0 : currentIndex + 1;
                    goTo(next);
                }
            }, 3500);
        };

        // 拖拽事件
        const onDragStart = (e) => {
            e.preventDefault();
            startX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
            isDragging = true;
            track.value?.classList.add('dragging');
            stopAuto();               // 拖拽时暂停自动轮播
            dragOffset = 0;
            updatePosition();
        };

        const onDragMove = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
            let delta = clientX - startX;

            // 边界限制：第一张不能向右拖，最后一张不能向左拖
            if ((currentIndex === 0 && delta > 0) || (currentIndex === slideCount - 1 && delta < 0)) {
                delta = 0;
            }

            const maxDrag = viewport.value?.clientWidth * 0.8 || 0;
            if (Math.abs(delta) > maxDrag) {
                delta = delta > 0 ? maxDrag : -maxDrag;
            }

            dragOffset = delta;
            updatePosition(dragOffset);
        };

        const onDragEnd = () => {
            if (!isDragging) return;
            isDragging = false;
            track.value?.classList.remove('dragging');

            const viewportWidth = viewport.value?.clientWidth || 0;
            if (Math.abs(dragOffset) > viewportWidth * threshold) {
                if (dragOffset > 0 && currentIndex > 0) {
                    goTo(currentIndex - 1);      // 向右拖，显示上一张
                } else if (dragOffset < 0 && currentIndex < slideCount - 1) {
                    goTo(currentIndex + 1);      // 向左拖，显示下一张
                } else {
                    updatePosition();             // 边界回弹
                }
            } else {
                updatePosition();                  // 未超过阈值回弹
            }

            dragOffset = 0;
            // 拖拽结束后，如果鼠标不在轮播区域，则恢复自动轮播
            if (!viewport.value?.closest('.topics-section')?.matches(':hover')) {
                startAuto();
            }
        };

        // 初始化轮播：绑定事件
        const initCarousel = () => {
            if (!viewport.value || !track.value) return;
            const slides = track.value.children;
            slideCount = slides.length;
            if (slideCount === 0) return;

            // 重置索引
            currentIndex = 0;
            updatePosition();

            // 绑定触摸/鼠标事件
            viewport.value.addEventListener('touchstart', onDragStart, { passive: false });
            viewport.value.addEventListener('touchmove', onDragMove, { passive: false });
            viewport.value.addEventListener('touchend', onDragEnd);
            viewport.value.addEventListener('touchcancel', onDragEnd);
            viewport.value.addEventListener('mousedown', onDragStart);
            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('mouseup', onDragEnd);
            viewport.value.addEventListener('mouseleave', () => isDragging && onDragEnd());

            const section = viewport.value.closest('.topics-section');
            if (section) {
                section.addEventListener('mouseenter', stopAuto);
                section.addEventListener('mouseleave', () => !isDragging && startAuto());
            }

            // 启动自动轮播
            startAuto();
        };

        // 销毁轮播：移除事件和定时器
        const destroyCarousel = () => {
            stopAuto();
            if (viewport.value) {
                viewport.value.removeEventListener('touchstart', onDragStart);
                viewport.value.removeEventListener('touchmove', onDragMove);
                viewport.value.removeEventListener('touchend', onDragEnd);
                viewport.value.removeEventListener('touchcancel', onDragEnd);
                viewport.value.removeEventListener('mousedown', onDragStart);
                viewport.value.removeEventListener('mouseleave', onDragEnd);
                window.removeEventListener('mousemove', onDragMove);
                window.removeEventListener('mouseup', onDragEnd);
                const section = viewport.value.closest('.topics-section');
                if (section) {
                    section.removeEventListener('mouseenter', stopAuto);
                    section.removeEventListener('mouseleave', startAuto);
                }
            }
        };

        // 获取数据
        const fetchTopics = async () => {
            try {
                const response = await fetch('./sdf-public/sdf-data/sdf-index.php?type=getAllTopics');
                const result = await response.json();
                topics.value = result.data;
            } catch (error) {                 
            }
        };

        // 组件挂载后：获取数据，然后初始化轮播
        onMounted(async () => {
            await fetchTopics();
            await nextTick();        // 等待 DOM 更新
            destroyCarousel();        // 清理之前可能残留的事件（首次调用无害）
            initCarousel();            // 初始化新轮播
        });

        // 组件卸载前清理
        onUnmounted(() => {
            destroyCarousel();
            window.removeEventListener('resize', updatePosition);
        });

        // 窗口大小变化时校正位置
        window.addEventListener('resize', () => updatePosition());

        return { topics, viewport, track, offset };
    }
});

topiclb.mount('#topiclb');
</script>
