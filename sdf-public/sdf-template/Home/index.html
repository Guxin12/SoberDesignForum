<script>
(function() {
    // 等待DOM加载完成
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initCarousel);
    } else {
        initCarousel();
    }

    function initCarousel() {
        const container = document.querySelector('#page-index .topics-section');
        if (!container) return;

        // 获取所有直接子元素中的 s-card
        const cards = Array.from(container.children).filter(el => el.tagName === 'S-CARD');
        if (cards.length === 0) return;

        // --- 构建轮播DOM结构 (不破坏原有容器) ---
        // 清空容器，但保留容器本身
        container.innerHTML = '';

        // 创建视口 div
        const viewport = document.createElement('div');
        viewport.className = 'carousel-viewport';

        // 创建轨道 div
        const track = document.createElement('div');
        track.className = 'carousel-track';

        // 将每个卡片包裹为 slide，并添加索引类用于背景区分
        cards.forEach((card, idx) => {
            const slide = document.createElement('div');
            slide.className = `carousel-slide slide-${idx}`;
            slide.appendChild(card);  // 移动原卡片到 slide 内
            track.appendChild(slide);
        });

        viewport.appendChild(track);
        container.appendChild(viewport);

        // --- 轮播状态变量 ---
        const slides = document.querySelectorAll('#page-index .topics-section .carousel-slide');
        const slideCount = slides.length;
        let index = 0;                 // 当前显示卡片的索引
        let startX = 0;                // 拖拽起始X坐标
        let dragOffset = 0;            // 当前拖拽偏移量（像素）
        let isDragging = false;        // 是否正在拖拽
        let timer = null;              // 自动轮播定时器
        const threshold = 0.3;         // 切换阈值（卡片宽度的30%）

        // --- 辅助函数：更新轨道位置 ---
        const updatePosition = (offset = 0) => {
            const basePercent = -index * 100;
            if (offset && viewport.clientWidth) {
                const offsetPercent = (offset / viewport.clientWidth) * 100;
                track.style.transform = `translateX(${basePercent + offsetPercent}%)`;
            } else {
                track.style.transform = `translateX(${basePercent}%)`;
            }
        };

        // --- 切换到指定索引（带动画）---
        const goTo = (newIndex) => {
            if (newIndex < 0 || newIndex >= slideCount) return;
            index = newIndex;
            track.classList.remove('dragging');
            updatePosition(0);
        };

        // --- 自动轮播控制 ---
        const stopAuto = () => { clearInterval(timer); timer = null; };
        const startAuto = () => {
            stopAuto();
            timer = setInterval(() => {
                if (!isDragging && !container.matches(':hover')) {
                    // 循环播放：最后一张后回到第一张
                    goTo(index === slideCount - 1 ? 0 : index + 1);
                }
            }, 3500);
        };

        // --- 拖拽事件 ---
        const onStart = (e) => {
            e.preventDefault();
            startX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
            isDragging = true;
            track.classList.add('dragging');
            stopAuto();
            dragOffset = 0;
            updatePosition(0);
        };

        const onMove = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
            let delta = clientX - startX; // 正数：向右拖拽（显示前一张），负数：向左拖拽（显示后一张）

            // 边界限制：第一张不能向右拖，最后一张不能向左拖
            if ((index === 0 && delta > 0) || (index === slideCount - 1 && delta < 0)) {
                delta = 0;
            }

            // 限制最大偏移量（不超过卡片宽度的80%）
            const maxDrag = viewport.clientWidth * 0.8;
            if (Math.abs(delta) > maxDrag) {
                delta = delta > 0 ? maxDrag : -maxDrag;
            }

            dragOffset = delta;
            updatePosition(dragOffset);
        };

        const onEnd = () => {
            if (!isDragging) return;
            isDragging = false;
            track.classList.remove('dragging');

            if (Math.abs(dragOffset) > viewport.clientWidth * threshold) {
                if (dragOffset > 0 && index > 0) {
                    goTo(index - 1);      // 向右拖拽，上一张
                } else if (dragOffset < 0 && index < slideCount - 1) {
                    goTo(index + 1);      // 向左拖拽，下一张
                } else {
                    updatePosition(0);    // 边界回弹
                }
            } else {
                updatePosition(0);       // 未超过阈值回弹
            }

            dragOffset = 0;
            if (!container.matches(':hover')) startAuto();
        };

        // --- 事件监听 ---
        viewport.addEventListener('touchstart', onStart, { passive: false });
        viewport.addEventListener('touchmove', onMove, { passive: false });
        viewport.addEventListener('touchend', onEnd);
        viewport.addEventListener('touchcancel', onEnd);

        viewport.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        viewport.addEventListener('mouseleave', (e) => isDragging && onEnd());

        // 悬停暂停/恢复自动播放
        container.addEventListener('mouseenter', stopAuto);
        container.addEventListener('mouseleave', () => !isDragging && startAuto());

        // 初始化
        updatePosition(0);
        startAuto();

        // 窗口大小变化时重新校正位置
        window.addEventListener('resize', () => updatePosition(0));
    }
})();
</script>
