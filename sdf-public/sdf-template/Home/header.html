session_start();
// 判断登录状态
$isLoggedIn = isset($_SESSION['login']) && $_SESSION['login'] === 'login';
$userId = $isLoggedIn && isset($_SESSION['user_id']) ? $_SESSION['user_id'] : null;

if ($isLoggedIn && $userId) {
    $currentUser = null;
    foreach ($user_config as $u) {
        if ($u['user_id'] == $userId) {
            $currentUser = $u;
            break;
        }
    }
    if (!$currentUser) {
        $isLoggedIn = false;
        unset($_SESSION['login'], $_SESSION['user_id']);
    } else {
        // 将 $user_config 重新赋值为当前用户的一维数组，方便后续代码直接使用
        $user_config = $currentUser;
    }
}
