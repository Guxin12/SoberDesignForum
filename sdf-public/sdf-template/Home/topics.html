<script>
const { createApp } = Vue;
    createApp({
        data() {
            return {
                topics: [],
                followersMap: {},
                dialogVisible: false,
                currentTopic: null,
                isMobile: window.innerWidth <= 600,
                currentUserId: <?php echo isset($userId) ? (int)$userId : 0; ?>
            }
        },
        computed: {
            currentFollowers() {
                if (!this.currentTopic) return [];
                return this.followersMap[this.currentTopic.topic_id] || [];
            }
        },
        methods: {
            handleResize() {
                this.isMobile = window.innerWidth <= 600;
            },
    
            fetchTopics() {
                return fetch('./sdf-public/sdf-data/sdf-index.php?type=getAllTopics')
                    .then(r => r.json())
                    .then(json => { if (json.code === 0) this.topics = json.data || []; })
                    .catch(() => { this.topics = []; });
            },
    
            fetchFollowers() {
                return fetch('./sdf-public/sdf-data/sdf-index.php?type=getAllTopicsfollow')
                    .then(r => r.json())
                    .then(result => {
                        if (result.code === 0 && Array.isArray(result.data)) {
                            const map = {};
                            result.data.forEach(item => map[item.topic_id] = item.followers || []);
                            this.followersMap = map;
                        }
                    })
                    .catch(() => {});
            },
    
            getFollowerCount(topic) {
                return this.followersMap[topic.topic_id]?.length || 0;
            },
    
            isFollowing(topic) {
                if (!this.currentUserId || !topic) return false;
                const followers = this.followersMap[topic.topic_id] || [];
                return followers.some(f => Number(f.user_id) === Number(this.currentUserId));
            },
    
            toggleFollow(topic) {                    
                const topic_id = topic.topic_id;
                fetch(`./sdf-public/sdf-data/SDF-index1.php?type=FollowTopic&topic_id=${topic_id}`)
                    .then(response => response.text())
                    .then(text => {
                        let json;
                        try {
                            json = JSON.parse(text);
                        } catch (e) {
                        }
    
                        if (json.code === 0) {
                            sober.Snackbar.builder(json.msg);
                            this.fetchFollowers();
                        } else {
                            sober.Snackbar.builder(json.msg);
                        }
                    })
                    .catch(err => {
                    });
            },
    
            showFollowers(topic) {
                this.currentTopic = topic;
                this.dialogVisible = false;
                this.$nextTick(() => { this.dialogVisible = true; });
            },
    
            closeDialog() {
                this.dialogVisible = false;
            }
        },
        mounted() {
            window.addEventListener('resize', this.handleResize);
            this.fetchTopics();
            this.fetchFollowers();
        },
        unmounted() {
            window.removeEventListener('resize', this.handleResize);
        }
    }).mount('#page-topics');
</script>
