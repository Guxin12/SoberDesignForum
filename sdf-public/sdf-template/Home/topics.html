<script>
    const { createApp } = Vue;
    createApp({
        data() {
            return {
                topics: [],
                followersMap: {},
                dialogVisible: false,
                currentTopic: null,
                isMobile: window.innerWidth <= 600
            }
        },
        computed: {
            currentFollowers() {
                if (!this.currentTopic) return [];
                return this.followersMap[this.currentTopic.topic_id] || [];
            }
        },
        methods: {
            handleResize() {
                this.isMobile = window.innerWidth <= 600;
            },
            fetchTopics() {
                return fetch('./sdf-public/sdf-data/sdf-index.php?type=getAllTopics')
                    .then(response => response.json())
                    .then(json => {
                        if (json.code === 0) {
                            this.topics = json.data || [];
                        }
                    })
                    .catch(() => {
                        this.topics = [];
                    });
            },
            fetchFollowers() {
                return fetch('./sdf-public/sdf-data/sdf-index.php?type=getAllTopicsfollow')
                    .then(r => r.json())
                    .then(result => {
                        if (result.code === 0 && Array.isArray(result.data)) {
                            const map = {};
                            result.data.forEach(item => {
                                map[item.topic_id] = item.followers || [];
                            });
                            this.followersMap = map;
                        }
                    })
                    .catch(error => {});
            },
            getFollowerCount(topic) {
                return this.followersMap[topic.topic_id]?.length || 0;
            },
            showFollowers(topic) {
                this.currentTopic = topic;
                this.dialogVisible = false;
                this.$nextTick(() => {
                    this.dialogVisible = true;
                });
            },
            closeDialog() {
                this.dialogVisible = false;
            },
            getFirstChar(name) {
                if (!name || name.length === 0) return '?';
                return name.charAt(0);
            }
        },
        mounted() {
            window.addEventListener('resize', this.handleResize);
            this.fetchTopics();
            this.fetchFollowers();
        },
        unmounted() {
            window.removeEventListener('resize', this.handleResize);
        }
    }).mount('#page-topics');
</script>


</body>
